faq5:
  question1: "¿Qué servicios ofrecen?"
  answer1: >
    Ofrecemos una gama de servicios que incluyen desarrollo de React,
    optimización SEO y consultoría técnica. Nuestros paquetes están diseñados
    para satisfacer diversas necesidades, desde startups hasta empresas. Cada
    servicio se adapta para garantizar un rendimiento óptimo y la satisfacción
    del usuario.
  question2: "¿Cómo se estructura el precio?"
  answer2: >
    Nuestros precios se basan en paquetes por horas, ofreciendo flexibilidad
    para diferentes alcances de proyectos. El paquete Starter comienza en 950
    CHF por 10 horas, mientras que los proyectos más grandes se pueden
    personalizar. Esta estructura asegura que solo pagues por lo que necesitas.
  question3: "¿Hay soporte multilingüe disponible?"
  answer3: >
    Sí, ofrecemos soporte bilingüe en español e inglés. Nuestro equipo está
    capacitado para ayudar a los clientes en ambos idiomas, asegurando una
    comunicación clara. También planeamos expandir el soporte a idiomas
    adicionales en el futuro.
  question4: "¿Cómo puedo contactarlos?"
  answer4: >
    Puedes contactarnos a través de nuestro formulario de contacto, correo
    electrónico o vía WhatsApp/Telegram. Estamos aquí para ayudarte con
    cualquier consulta o presupuesto que necesites. Nuestro equipo está listo
    para responder rápidamente.
  question5: "¿Cuál es su tiempo de respuesta?"
  answer5: >
    Nos esforzamos por responder a todas las consultas en un plazo de 24 horas.
    Nuestro objetivo es proporcionar soporte oportuno para asegurar que tus
    proyectos se mantengan en marcha. Tu satisfacción es nuestra prioridad.
