faq5:
  question1: "What services do you offer?"
  answer1: >
    We provide a range of services including React development, SEO
    optimization, and technical consulting. Our packages are designed to meet
    various needs, from startups to enterprises. Each service is tailored to
    ensure optimal performance and user satisfaction.
  question2: "How is pricing structured?"
  answer2: >
    Our pricing is based on hourly packages, offering flexibility for different
    project scopes. The Starter package begins at 950 CHF for 10 hours, while
    larger projects can be customized. This structure ensures you only pay for
    what you need.
  question3: "Is multilingual support available?"
  answer3: >
    Yes, we offer bilingual support in Spanish and English. Our team is equipped
    to assist clients in both languages, ensuring clear communication. We also
    plan to expand support to additional languages in the future.
  question4: "How can I contact you?"
  answer4: >
    You can reach us through our contact form, email, or via WhatsApp/Telegram.
    We are here to assist you with any inquiries or quotes you may need. Our
    team is ready to respond promptly.
  question5: "What is your response time?"
  answer5: >
    We strive to respond to all inquiries within 24 hours. Our goal is to
    provide timely support to ensure your projects stay on track. Your
    satisfaction is our priority.
